name: CD - Automated Cloud Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: CI Gate - Scan, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend
        run: cd frontend && npm ci && npm run build

      - name: Verify Backend
        run: cd backend && npm ci && node --check src/server.js

  deploy-app:
    name: Deploy App (Azure App Service)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package Backend Application
        run: |
          cd backend
          npm ci --omit=dev
          zip -r ../backend.zip .

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend to Azure App Service
        run: |
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --src-path backend.zip \
            --type zip

  deploy-web:
    name: Deploy Web (Azure Static Website)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Production Frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Static Files to Azure Blob ($web)
        run: |
          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --query "[0].value" -o tsv)
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --account-key "$ACCOUNT_KEY" \
            --destination '$web' \
            --source frontend/dist \
            --overwrite true

live-healthcheck:
    name: Live Healthcheck & E2E Verification
    runs-on: ubuntu-latest
    needs: [deploy-app, deploy-web]
    steps:
      - name: Verify Backend API Healthcheck
        run: |
          API_URL=$(echo "${{ secrets.VITE_API_BASE_URL }}" | tr -d '[:space:]"')
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend Healthcheck HTTP 200 OK"
              curl -i "${API_URL}/health"
              echo ""
              curl -i "${API_URL}/tasks"
              exit 0
            fi
            sleep 6
          done
          exit 1